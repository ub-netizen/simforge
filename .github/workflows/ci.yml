name: CI

# Checks every pull request and every push to a branch other than main
# (pushes to main are checked by the deploy workflow before publishing).
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies (from the lockfile)
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # tests use the runner's preinstalled Google Chrome
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and validation tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Browser tests
        run: npx playwright test
      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
